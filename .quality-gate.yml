
# v2 layout: the master plan is project-owned, not framework content.
status:
  guidelinesPath: "."
  masterPlanPath: project/master_plan.md

# Refuse to trust a gate binary older than this. A stale binary silently runs
# old rules; without this pin nothing says so. Ratchet on each deploy that the
# repo depends on. Warns on every run; fails only under --strict.
minimumGateVersion: "2026-10-06"

# doc-comment-code cannot evaluate this package, so it is declined rather than
# reported on. Ignite depends on swift-markdown, whose C target
# `cmark_gfm_extensions` the fence compile cannot reach: compilation stops at
# that barrier before a single fence is read. 16 of the 17 findings it produces
# are that barrier restated, and the checker says so itself — "this fence's
# error count means nothing until the barrier is resolved."
#
# This records that the checker cannot evaluate this package. It does NOT record
# that the documentation is fine — that is unknown, and stays unknown until the
# fence compile learns to feed a package's C-target module maps to the compiler.
# Remove this entry then. The 17th finding is real but of the same family: the
# preamble is a plain `import`, so a fence on an internal symbol (`QRCode`) has
# nothing to resolve against.
#
# `--check doc-comment-code` still runs it here on purpose, so the barrier stays
# visible and this entry stays reviewable.
#
# doc-code is declined for the same reason, by the owner's decision on 2026-10-05.
# It compiles the DocC catalogue's fences as one program and stops at the same
# `cmark_gfm_extensions` barrier before reading any of them: all 12 of its
# findings are `doc-code.barrier`, none is about a fence. As above, this records
# that the checker cannot evaluate the package, not that the articles compile.
# Remove both entries together when the fence compile can reach a C target.
excludedCheckers:
  - doc-comment-code
  - doc-code

# The one file allowed to construct a `Process`. It is the only place the CLI
# spawns anything, and it is the bounded helper the rule asks for: every run
# has a timeout (SIGTERM, then SIGKILL), and both pipes are drained while the
# child runs. The checker's default kernel is quality-gate's own ProcessRunner,
# which this package does not have.
boundedIO:
  kernelPath: Sources/IgniteCLI/Process-Execute.swift
